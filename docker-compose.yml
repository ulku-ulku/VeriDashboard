version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce_analytics
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: analytics_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_user -d ecommerce_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ecommerce_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce_analytics
      DB_USER: analytics_user
      DB_PASSWORD: analytics_pass
      LOG_LEVEL: INFO
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python -m src.data_generation.generate_data &&
             python -m src.etl.load_to_postgres &&
             python -m src.ml.churn_prediction &&
             python -m src.forecasting.revenue_forecast &&
             streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0"

volumes:
  postgres_data:
